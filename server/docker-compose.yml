version: '3.8'
services:
  mongodb:
    image: mongo:8
    container_name: mongodb_task4_7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /tmp/mongo-keyfile
    entrypoint:
      - sh
      - -c
      - printf 'task4localreplicakey1234567890\n' > /tmp/mongo-keyfile && chown mongodb:mongodb /tmp/mongo-keyfile && chmod 400 /tmp/mongo-keyfile && exec /usr/local/bin/docker-entrypoint.sh "$${@}"
      - --
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data_task4_7:/data/db
    networks:
      default:
        aliases:
          - mongo

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express_task4_7
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin123}
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    volumes:
      - ./config.js:/app/config.js:ro

  mongo-init:
    image: mongo:8
    depends_on:
      - mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    restart: "no"
    command:
      - sh
      - -c
      - >-
        until mongosh --host mongodb:27017
        -u "$${MONGO_INITDB_ROOT_USERNAME}"
        -p "$${MONGO_INITDB_ROOT_PASSWORD}"
        --authenticationDatabase admin
        --quiet --eval "db.adminCommand({ ping: 1 }).ok" >/dev/null 2>&1; do
          sleep 1;
        done;
        mongosh --host mongodb:27017
        -u "$${MONGO_INITDB_ROOT_USERNAME}"
        -p "$${MONGO_INITDB_ROOT_PASSWORD}"
        --authenticationDatabase admin
        --quiet --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) } catch (error) { if (!error.message.includes('already initialized')) throw error }"

  app:
    build: .
    container_name: task4_7_app
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      DATABASE_URL: "mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/task4_7?authSource=admin"
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "sleep 5 && npx prisma generate && npx prisma db push --accept-data-loss || true && npm run start"

volumes:
  mongodb_data_task4_7:
